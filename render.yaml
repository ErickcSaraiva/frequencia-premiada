services:
  - type: web
    name: frequencia-premiada-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: frequencia-premiada-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.5

databases:
  - name: frequencia-premiada-db
    plan: free
    region: oregon
    databaseName: frequencia_premiada
    user: frequencia
    postgresMajorVersion: "17"
    ipAllowList: []
